name: Daily Telegram Bot

on:
  schedule:
    # UTC 기준 오전 1시 = 한국 시간(KST) 오전 10시 (매일 실행)
    - cron: '0 1 * * *'
  workflow_dispatch: # 필요할 때 버튼을 눌러 수동 테스트할 수 있게 하는 설정

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필요한 라이브러리 설치
        run: |
          pip install requests bs4 lxml

      - name: 파이썬 스크립트 실행
        run: |
          python main.py
